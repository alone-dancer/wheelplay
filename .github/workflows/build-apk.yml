name: Build & Release Signed APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 1. 解码签名密钥文件保存到根目录
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      # 2. 生成唯一的动态版本号和时间戳标签
      - name: Generate Version Tag
        id: version
        run: |
          DATE_STR=$(date +'%Y.%m.%d-%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="v${DATE_STR}-${SHORT_SHA}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      # 3. 使用 Gradle 编译并自动签名 APK
      - name: Build & Sign Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # 4. 重命名并整理生成的 APK 文件
      - name: Prepare APK for Release
        run: |
          # 查找生成的所有 release apk
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "错误：未查找到生成的 APK 文件！"
            exit 1
          fi
          
          NEW_APK_NAME="wheelplay-${{ steps.version.outputs.tag }}.apk"
          NEW_APK_PATH="app/build/outputs/apk/release/$NEW_APK_NAME"
          
          mv "$APK_PATH" "$NEW_APK_PATH"
          echo "FINAL_APK_PATH=$NEW_APK_PATH" >> $GITHUB_ENV

      # 5. 创建 GitHub Release 并上传带签名的 APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "WheelPlay ${{ steps.version.outputs.tag }}"
          body: |
            Automated build for WheelPlay.
            - Commit: ${{ github.sha }}
            - Date: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: ${{ env.FINAL_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
