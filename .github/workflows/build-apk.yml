name: Build & Release Signed APK

on:
  push:
    branches:
      - main     # 当代码有 push 时触发
      - master
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 1. 解码签名密钥文件
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      # 2. 生成唯一的动态版本号和时间戳标签
      - name: Generate Version Tag
        id: version
        run: |
          DATE_STR=$(date +'%Y.%m.%d-%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="v${DATE_STR}-${SHORT_SHA}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      # 3. 使用 Gradle 编译 Release APK
      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # 4. 使用 Android 原生 apksigner 工具进行签名（无第三方依赖，最稳定）
      - name: Sign APK with Native apksigner
        run: |
          # 自动定位 Android SDK 中的 apksigner 工具
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          
          # 寻找 Gradle 编译出的未签名 Release APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          FINAL_APK_NAME="wheelplay-${{ steps.version.outputs.tag }}.apk"
          FINAL_APK_PATH="app/build/outputs/apk/release/$FINAL_APK_NAME"
          
          # 使用 apksigner 进行签名并输出最终 APK
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$FINAL_APK_PATH" \
            "$UNSIGNED_APK"
            
          echo "FINAL_APK_PATH=$FINAL_APK_PATH" >> $GITHUB_ENV

      # 5. 创建 GitHub Release 并上传签名的 APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "WheelPlay ${{ steps.version.outputs.tag }}"
          body: |
            Automated build for WheelPlay.
            - Commit: ${{ github.sha }}
            - Date: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: ${{ env.FINAL_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
