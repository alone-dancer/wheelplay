name: Daily Sync with Upstream

on:
  schedule:
    # 每天 UTC 时间 0:00（北京时间 8:00）自动触发
    - cron: '0 0 * * *'
  # 允许手动在 Actions 页面点击触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加原作者仓库为 upstream
          git remote add upstream https://github.com/fython/wheelplay.git || true
          git fetch upstream
          
          # 假设主分支为 main（如果是 master 请自行更改）
          DEFAULT_BRANCH="main"
          git checkout $DEFAULT_BRANCH
          
          # 检查是否有新提交
          LOCAL_COMMIT=$(git rev-parse HEAD)
          UPSTREAM_COMMIT=$(git rev-parse upstream/$DEFAULT_BRANCH)
          
          if [ "$LOCAL_COMMIT" != "$UPSTREAM_COMMIT" ]; then
            echo "Detect new commits from upstream. Merging..."
            git merge upstream/$DEFAULT_BRANCH --no-edit
            git push origin $DEFAULT_BRANCH
            echo "SYNCED=true" >> $GITHUB_ENV
          else
            echo "Already up to date."
            echo "SYNCED=false" >> $GITHUB_ENV
          fi
